services:
  app:
    build: .
    image: ticketflow:dev
    ports:
      - "8000:8000"
    volumes:
      # Only logs and the database are shared with the host, so the agents (log-analyst,
      # verifier) read the same var/log/dev.log the container writes. The cache stays in
      # the container: Symfony's cache:clear cannot rename directories on a Windows mount.
      - ./var/log:/app/var/log
      - ./var/db:/app/var/db
      # Live source for development; vendor stays in the image.
      - ./src:/app/src
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./public:/app/public
    environment:
      APP_ENV: dev
      DATABASE_URL: "sqlite:////app/var/db/data_dev.db"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/stats') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
